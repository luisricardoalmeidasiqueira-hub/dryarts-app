/* Layout: app de uma coluna para celular, fundo de etamine, navegação fixa embaixo */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f2ec; --tela:#fffdf9; --tela2:#efe8de; --fg:#2d2420; --sub:#7a6b62; --linha:#e2d8cb;
  --acento:#a8324a; --acento-s:#f6dde2; --verde:#3f7d4e; --verde-s:#dcefe1; --azul:#3a5f8f; --azul-s:#dde7f4;
  --laranja:#e0801c; --vermelho:#c9302c; --grade:rgba(120,90,60,.06);
  --f-tit:"Young Serif",Georgia,serif; --f-txt:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1816; --tela:#26201d; --tela2:#302824; --fg:#f1e9e1; --sub:#b3a398; --linha:#3d342f;
  --acento:#e2768a; --acento-s:#4a2730; --verde:#7fc28f; --verde-s:#22382a; --azul:#8fb2e2; --azul-s:#24324a;
  --laranja:#f0a24b; --vermelho:#f0736e; --grade:rgba(255,230,200,.04); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1816; --tela:#26201d; --tela2:#302824; --fg:#f1e9e1; --sub:#b3a398; --linha:#3d342f;
  --acento:#e2768a; --acento-s:#4a2730; --verde:#7fc28f; --verde-s:#22382a; --azul:#8fb2e2; --azul-s:#24324a;
  --laranja:#f0a24b; --vermelho:#f0736e; --grade:rgba(255,230,200,.04); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-txt);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);
  background-size:7px 7px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;border-bottom:1px dashed var(--linha)}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca h1{font-family:var(--f-tit);font-weight:400;font-size:1.35rem;margin:0;letter-spacing:.2px}
.marca small{display:block;color:var(--sub);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.bastidor{width:38px;height:38px;border-radius:50%;border:3px solid #b98a5a;background:var(--tela);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--tela2)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--acento);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:var(--tela2);color:var(--fg)}
.btn.peq{padding:6px 10px;font-size:.85rem;border-radius:10px}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.perfil{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;flex:none}
.perfil img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--acento);display:block}
.boasvindas{display:flex;align-items:center;gap:14px;margin-top:14px}
.boasvindas img{border-radius:50%;object-fit:cover;border:3px solid var(--acento);flex:none;cursor:pointer;max-width:45%}
.boasvindas .nome{font-family:var(--f-tit);font-size:1.4rem;line-height:1.15}
.rodape-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.aula{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.aula-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.celular{border:10px solid #2d2420;border-radius:30px;background:var(--tela);height:300px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.cel-topo{background:var(--bg);padding:10px 14px;font-family:var(--f-tit);font-size:1.05rem;border-bottom:1px dashed var(--linha);display:flex;align-items:center;gap:8px}
.cel-corpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cel-linha{height:12px;border-radius:6px;background:var(--tela2)}
.cel-btn{align-self:flex-start;background:var(--acento);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;position:relative;animation:pulsa 1.6s infinite}
.cel-btn.sec{background:var(--tela2);color:var(--fg)}
.cel-campo{border:1px solid var(--linha);border-radius:8px;padding:7px 10px;font-size:.85rem;color:var(--sub);background:var(--bg)}
.dedo{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(168,50,74,.25);border:2px solid var(--acento);right:-14px;bottom:-16px;animation:toque 1.6s infinite}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(168,50,74,.45)}50%{box-shadow:0 0 0 10px rgba(168,50,74,0)}}
@keyframes toque{0%,100%{transform:scale(1)}40%{transform:scale(.7)}}
.legenda-aula{font-size:1.08rem;line-height:1.5;min-height:4.5em;background:var(--tela);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.aula-ctrl{display:flex;gap:8px;align-items:center;justify-content:center}
.aula-ctrl .btn{min-width:56px}
.cap-lista{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cap-lista button{border:1px solid var(--linha);background:var(--tela);border-radius:999px;padding:6px 12px;font-size:.8rem;white-space:nowrap;cursor:pointer}
.cap-lista button.on{background:var(--acento);color:#fff;border-color:var(--acento)}
.passo{border-bottom:1px solid var(--linha);padding:10px 0}
.passo:last-child{border-bottom:0}
.passo summary{font-weight:700;cursor:pointer}
.passo ul{margin:8px 0 0;padding-left:18px}
.passo li{margin-bottom:4px}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:220px;max-width:100%;margin:6px auto}
.qrbox svg{display:block;width:100%;height:auto}
.arte{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:12px;border:1px solid var(--linha)}
.marca-card{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px}
.marca-card img{width:104px;height:104px;border-radius:50%;flex:none;object-fit:cover;background:#fff}
.flip{perspective:600px;flex:none;border-radius:50%}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s ease-in-out}
.flip-in img{position:absolute;inset:0;width:100%!important;height:100%!important;border-radius:50%;object-fit:cover;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--acento);background:var(--tela);display:block;max-width:none!important}
.flip-in img.verso{transform:rotateY(180deg)}
@keyframes vira{0%,40%{transform:rotateY(0)}50%,90%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.perfil .flip-in img{border-width:2px}
.insta-link{display:inline-flex;align-items:center;gap:5px;color:var(--acento);font-weight:600;text-decoration:none;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
.fotos-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:10px}
.fotos-ed div{position:relative}
.fotos-ed img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:2px solid var(--acento);display:block}
.fotos-ed button{position:absolute;top:-4px;right:-4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--vermelho);color:#fff;cursor:pointer;font-weight:700}
.foto-wrap{position:relative;flex:none}
.mini-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--linha);background:var(--tela);color:var(--acento);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.mini-btn.cam{position:absolute;right:2px;bottom:2px;background:var(--acento);color:#fff;border:2px solid var(--bg);width:34px;height:34px}
.boasvindas .insta-link{margin-top:4px}
.icone{background:none;border:0;padding:6px;cursor:pointer;color:var(--fg);border-radius:10px}
h2{font-family:var(--f-tit);font-weight:400;font-size:1.25rem;margin:18px 0 8px;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:18px 0 8px;font-weight:600}
.card{background:var(--tela);border:1px solid var(--linha);border-radius:16px;padding:14px}
.lista{display:flex;flex-direction:column;gap:10px}
.linha{display:flex;align-items:center;gap:10px;min-width:0}
.cresce{flex:1;min-width:0}
.mudo{color:var(--sub);font-size:.85rem}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--tela2);color:var(--sub);white-space:nowrap}
.chip.aguardando{background:var(--tela2);color:var(--sub)}
.chip.bordando{background:var(--azul-s);color:var(--azul)}
.chip.pronto{background:var(--verde-s);color:var(--verde)}
.chip.entregue{background:transparent;border:1px solid var(--linha);color:var(--sub)}
.bolinha{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.b-laranja{background:var(--laranja)} .b-vermelha{background:var(--vermelho)} .b-verde{background:var(--verde)}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resumo .card b{display:block;font-family:var(--f-tit);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.campo label{font-size:.8rem;color:var(--sub);font-weight:600}
input,select,textarea{background:var(--tela);border:1px solid var(--linha);border-radius:10px;padding:10px;width:100%}
textarea{min-height:70px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tela);border-top:1px solid var(--linha);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--linha);background:var(--tela2)}
.semfoto{background-image:linear-gradient(45deg,transparent 42%,var(--acento-s) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--acento-s) 42% 58%,transparent 58%);background-size:12px 12px}
.prev{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--tela2);margin-bottom:10px}
.b-entrada,.entrada{color:var(--verde)} .saida{color:var(--vermelho)}
details summary{list-style-position:inside}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;color:var(--sub);padding:6px 1px;min-width:0;border-radius:10px;position:relative;flex:1;cursor:pointer}
.nav button.ativo{color:var(--acento);font-weight:700}
.nav .ponto{position:absolute;top:4px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--laranja);border:2px solid var(--tela)}
.progresso{height:10px;border-radius:99px;background:var(--tela2);overflow:hidden}
.progresso i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--acento) 0 6px,color-mix(in srgb,var(--acento) 75%,#fff) 6px 12px)}
.carretel{width:30px;height:30px;border-radius:8px;border:1px solid var(--linha);flex:none;position:relative}
.carretel::after{content:"";position:absolute;inset:40% 0;background:rgba(255,255,255,.25)}
.ferr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ferr button{text-align:left;background:var(--tela);border:1px solid var(--linha);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ferr button b{font-family:var(--f-tit);font-weight:400;font-size:1.02rem}
.voltar{background:none;border:0;color:var(--acento);font-weight:600;padding:8px 0;cursor:pointer}
.result{background:var(--acento-s);border-radius:14px;padding:12px;margin-top:6px}
.result b{font-variant-numeric:tabular-nums}
.grade-box{overflow-x:auto;border:1px solid var(--linha);border-radius:12px;background:#fff;margin-top:10px}
canvas#grade{display:block}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--linha);text-align:left}
th{font-size:.75rem;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.tabwrap{overflow-x:auto}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filtros button{border:1px solid var(--linha);background:var(--tela);border-radius:999px;padding:6px 12px;font-size:.82rem;white-space:nowrap;cursor:pointer}
.filtros button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,12,8,.45);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:.9rem}
.exemplo{font-size:.7rem;color:var(--laranja);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
footer.rodape{text-align:center;color:var(--sub);font-size:.75rem;margin-top:28px;line-height:1.6}
.dica{border-left:3px dotted var(--acento);padding:4px 0 4px 12px}
.ponto-g{display:flex;gap:12px}
.ponto-g svg{flex:none}
.cont{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.cont b{font-family:var(--f-tit);font-weight:400;font-size:2rem;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}

function pontos(){

}

      <div class="mudo" style="margin-top:10px">Contador de carreiras / voltas</div>
      <div class="cont"><button class="btn sec" onclick="carr('${p.id}',-1)" aria-label="Diminuir">−</button><b>${p.carreira||0}</b><button class="btn" onclick="carr('${p.id}',1)" aria-label="Aumentar">+</button></div>
    </div>`}).join("")||`<div class="card mudo">Nenhum projeto ainda.</div>`}</div>`;
},
linhas(){

     <button class="btn sec peq" onclick="qtdL('${x.id}',-1)" aria-label="Menos">−</button><b style="min-width:22px;text-align:center;font-variant-numeric:tabular-nums">${x.qtd}</b><button class="btn sec peq" onclick="qtdL('${x.id}',1)" aria-label="Mais">+</button>

  <div class="linha"><input id="novaCompra" placeholder="Ex.: agulha tapeçaria 24"><button class="btn peq" onclick="addC()">Adicionar</button></div>

ferramentas(){

  return `<h2>Ferramentas</h2><div class="ferr">${Object.entries(FERR).map(([k,f])=>`<button onclick="sub='${k}';render()"><b>${f.nome}</b><span class="mudo">${f.desc}</span></button>`).join("")}</div>`;

function nomeDMC(c){return(DMC.find(d=>d[0].toLowerCase()===String(c).toLowerCase())||[,"cor personalizada"])[1]}
function cardEnc(e){
  const al=alertaEnc(e), d=diasAte(e.entrega);
  const quando=d===null?"sem data":d<0?`atrasada ${-d} dia(s)`:d===0?"entrega hoje":d===1?"entrega amanhã":`entrega ${dataBR(e.entrega)}`;
  const falta=(+e.valor||0)-(+e.sinal||0);
  return `<button class="card" style="text-align:left;cursor:pointer;width:100%" onclick="verEnc('${e.id}')">
    ${e.ex?'<div class="exemplo">exemplo</div>':""}
    <div class="linha"><div class="cresce"><b>${esc(e.cliente)}</b> <span class="mudo">· ${esc(e.peca)}</span></div><span class="chip ${e.status}">${ROT[e.status]}</span></div>
    <div class="linha mudo" style="margin-top:4px">${al?`<span class="bolinha b-${al}"></span>`:""}<span class="cresce">${esc(e.tecnica)} · ${quando}</span><span>${brl(e.valor)}${falta>0&&e.status!=="entregue"?` · falta ${brl(falta)}`:""}</span></div>
  </button>`;
}
const ROT={aguardando:"Aguardando",bordando:"Bordando",pronto:"Pronto",entregue:"Entregue"};

/* ---------- encomendas ---------- */
function abrir(h){$("#folha").innerHTML=h;$("#modal").hidden=false}
function fechar(){$("#modal").hidden=true}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")fechar()});
const PECAS=["Toalha de banho","Toalha de rosto","Pano de prato","Fralda de boca","Jaleco","Avental","Bastidor decorativo","Kit enxoval","Camiseta","Almofada","Uniforme escolar","Outra"];
const TECN=["Ponto cruz","Bordado livre","Vagonite","Ponto russo","Pedraria","Bordado à máquina","Monograma/nome"];
function formEnc(id){
  const e=D.encomendas.find(x=>x.id===id)||{status:"aguardando",entrega:somaDias(7)};
  abrir(`<h2 style="margin-top:4px">${id?"Editar":"Nova"} encomenda</h2>
  <div class="campo"><label for="fCli">Cliente</label><input id="fCli" value="${esc(e.cliente)}" list="dlCli"></div>
  <datalist id="dlCli">${[...new Set(D.encomendas.map(x=>x.cliente))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <div class="campo"><label for="fFone">WhatsApp</label><input id="fFone" inputmode="tel" value="${esc(e.fone)}" placeholder="(15) 9____-____"></div>
  <div class="duas"><div class="campo"><label for="fPeca">Peça</label><select id="fPeca">${PECAS.map(p=>`<option ${p===e.peca?"selected":""}>${p}</option>`).join("")}</select></div>
  <div class="campo"><label for="fTec">Técnica</label><select id="fTec">${TECN.map(p=>`<option ${p===e.tecnica?"selected":""}>${p}</option>`).join("")}</select></div></div>
  <div class="campo"><label for="fTxt">O que bordar (nome, desenho, frase)</label><input id="fTxt" value="${esc(e.texto)}"></div>
  <div class="campo"><label for="fCor">Cor da linha</label><input id="fCor" value="${esc(e.cor)}" placeholder="Ex.: Rosa bebê 818"></div>
  <div class="duas"><div class="campo"><label for="fEnt">Entrega</label><input type="date" id="fEnt" value="${e.entrega||""}"></div>
  <div class="campo"><label for="fSt">Situação</label><select id="fSt">${Object.keys(ROT).map(k=>`<option value="${k}" ${k===e.status?"selected":""}>${ROT[k]}</option>`).join("")}</select></div></div>
  <div class="duas"><div class="campo"><label for="fVal">Valor total (R$)</label><input id="fVal" inputmode="decimal" value="${e.valor??""}"></div>
  <div class="campo"><label for="fSin">Sinal pago (R$)</label><input id="fSin" inputmode="decimal" value="${e.sinal??""}"></div></div>
  <div class="campo"><label for="fObs">Observações</label><textarea id="fObs">${esc(e.obs)}</textarea></div>
  <div class="linha"><button class="btn sec cresce" onclick="fechar()">Cancelar</button><button class="btn cresce" onclick="salvaEnc('${id||""}')">Salvar</button></div>`);
}
function num(v){return parseFloat(String(v).replace(",","."))||0}
function salvaEnc(id){
  const v={cliente:$("#fCli").value.trim()||"Sem nome",fone:$("#fFone").value,peca:$("#fPeca").value,tecnica:$("#fTec").value,texto:$("#fTxt").value,cor:$("#fCor").value,entrega:$("#fEnt").value,status:$("#fSt").value,valor:num($("#fVal").value),sinal:num($("#fSin").value),obs:$("#fObs").value};
  if(id)Object.assign(D.encomendas.find(x=>x.id===id),v,{ex:0});else D.encomendas.push({id:uid(),...v});
  salvar();fechar();render();aviso("Encomenda salva");
}
function verEnc(id){
  const e=D.encomendas.find(x=>x.id===id);const falta=(+e.valor||0)-(+e.sinal||0);
  const msg=msgCliente(e);const tel=String(e.fone||"").replace(/\D/g,"");
  abrir(`<div class="linha"><h2 class="cresce" style="margin-top:4px">${esc(e.cliente)}</h2><span class="chip ${e.status}">${ROT[e.status]}</span></div>
  <div class="card"><table><tbody>
  <tr><th>Peça</th><td>${esc(e.peca)}</td></tr><tr><th>Técnica</th><td>${esc(e.tecnica)}</td></tr>
  <tr><th>Bordar</th><td>${esc(e.texto)||"—"}</td></tr><tr><th>Linha</th><td>${esc(e.cor)||"—"}</td></tr>
  <tr><th>Entrega</th><td>${dataBR(e.entrega)}</td></tr><tr><th>Valor</th><td>${brl(e.valor)} (sinal ${brl(e.sinal)}, falta ${brl(falta)})</td></tr>
  <tr><th>WhatsApp</th><td style="user-select:all">${esc(e.fone)||"—"}</td></tr>${e.obs?`<tr><th>Obs.</th><td>${esc(e.obs)}</td></tr>`:""}</tbody></table></div>
  <h3>Mudar situação</h3><div class="filtros">${Object.keys(ROT).map(k=>`<button class="${k===e.status?"on":""}" onclick="stEnc('${id}','${k}')">${ROT[k]}</button>`).join("")}</div>
  <h3>Mensagem para a cliente</h3><div class="card" style="white-space:pre-wrap;user-select:all">${esc(msg)}</div>
  <div class="linha" style="margin-top:8px"><button class="btn sec cresce" onclick="copiar(${esc(JSON.stringify(msg))})">Copiar mensagem</button>${tel?`<a class="btn cresce" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${tel}?text=${encodeURIComponent(msg)}">Abrir WhatsApp</a>`:""}</div>
  ${falta>0?`<button class="btn" style="width:100%;margin-top:10px" onclick="cobrar('${id}')">Cobrar com Pix (${brl(falta)})</button>`:""}
  ${+e.valor?`<button class="btn sec" style="width:100%;margin-top:10px" onclick="lancaEnc('${id}')">Lançar no caixa</button>`:""}
  <div class="linha" style="margin-top:16px"><button class="btn sec cresce" onclick="formEnc('${id}')">Editar</button><button class="btn sec cresce" id="bDel" onclick="confDel('${id}')">Excluir</button></div>`);
}
function msgCliente(e){
  const n=e.cliente.split(" ")[0];const falta=(+e.valor||0)-(+e.sinal||0);
  if(e.status==="pronto")return`Oi, ${n}! Sua encomenda (${e.peca}${e.texto?" – "+e.texto:""}) está pronta 🧵✨${falta>0?`\nValor restante: ${brl(falta)}.`:""}\nQuando fica bom para retirar?`;
  if(e.status==="entregue")return`Oi, ${n}! Obrigada pela preferência 💕 Espero que tenha gostado do bordado. Se puder, me manda uma foto usando!`;
  return`Oi, ${n}! Confirmando sua encomenda:\n• ${e.peca}${e.texto?" – "+e.texto:""}\n• ${e.tecnica}${e.cor?", linha "+e.cor:""}\n• Entrega: ${dataBR(e.entrega)}\n• Valor: ${brl(e.valor)}${e.sinal?` (sinal de ${brl(e.sinal)} recebido)`:""}`;
}
function stEnc(id,s){D.encomendas.find(x=>x.id===id).status=s;salvar();render();verEnc(id)}
function confDel(id){const b=$("#bDel");if(b.dataset.c){D.encomendas=D.encomendas.filter(x=>x.id!==id);salvar();fechar();render();aviso("Encomenda excluída")}else{b.dataset.c=1;b.textContent="Toque de novo para excluir";b.style.background="var(--vermelho)";b.style.color="#fff"}}

function salvaP(id){const v={nome:$("#pN").value.trim()||"Projeto",tecnica:$("#pT").value,total:parseInt($("#pTot").value)||0,feitos:parseInt($("#pF").value)||0,obs:$("#pO").value,ex:0};
  if(id)Object.assign(D.projetos.find(x=>x.id===id),v);else D.projetos.unshift({id:uid(),carreira:0,...v});salvar();fechar();render()}
function delP(id){const b=$("#bDelP");if(b.dataset.c){D.projetos=D.projetos.filter(x=>x.id!==id);salvar();fechar();render()}else{b.dataset.c=1;b.textContent="Toque de novo";b.style.background="var(--vermelho)";b.style.color="#fff"}}
function pontoP(id,n){const p=D.projetos.find(x=>x.id===id);p.feitos=Math.max(0,Math.min(p.total||1e9,p.feitos+n));salvar();render()}
function carr(id,n){const p=D.projetos.find(x=>x.id===id);p.carreira=Math.max(0,(p.carreira||0)+n);salvar();render()}

function formLinha(){
  abrir(`<h2 style="margin-top:4px">Adicionar linha</h2>
  <div class="campo"><label for="lC">Código DMC (ou outra marca)</label><input id="lC" list="dlDMC" placeholder="Ex.: 310"></div>
  <datalist id="dlDMC">${DMC.map(d=>`<option value="${d[0]}">${d[1]}</option>`).join("")}</datalist>
  <div class="campo"><label for="lQ">Meadas em casa</label><input id="lQ" inputmode="numeric" value="1"></div>
  <h3>Ou toque numa cor</h3><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px">${DMC.map(d=>`<button title="${d[0]} ${d[1]}" aria-label="DMC ${d[0]} ${d[1]}" onclick="$('#lC').value='${d[0]}'" style="aspect-ratio:1;border-radius:8px;border:1px solid var(--linha);background:${d[2]};cursor:pointer"></button>`).join("")}</div>
  <div class="linha" style="margin-top:14px"><button class="btn sec cresce" onclick="fechar()">Cancelar</button><button class="btn cresce" onclick="salvaL()">Salvar</button></div>`);
}
function salvaL(){const c=$("#lC").value.trim();if(!c)return aviso("Digite o código da linha");const ex=D.linhas.find(l=>l.cod.toLowerCase()===c.toLowerCase());const q=parseInt($("#lQ").value)||0;
  if(ex)ex.qtd+=q;else D.linhas.push({id:uid(),cod:c,qtd:q});salvar();fechar();render()}
function qtdL(id,n){const l=D.linhas.find(x=>x.id===id);l.qtd=Math.max(0,l.qtd+n);salvar();render()}
function delL(id){D.linhas=D.linhas.filter(x=>x.id!==id);salvar();render()}
function addC(){const v=$("#novaCompra").value.trim();if(!v)return;D.compras.push({id:uid(),txt:v,ok:false});salvar();render()}
function togC(id){const c=D.compras.find(x=>x.id===id);c.ok=!c.ok;salvar();render()}
function delC(id){D.compras=D.compras.filter(x=>x.id!==id);salvar();render()}
function faltantes(){let n=0;D.linhas.filter(l=>l.qtd<=1).forEach(l=>{const t=`Linha DMC ${l.cod} – ${nomeDMC(l.cod)}`;if(!D.compras.some(c=>c.txt===t&&!c.ok)){D.compras.push({id:uid(),txt:t,ok:false});n++}});salvar();render();aviso(n?"Linhas adicionadas à lista":"Nada novo para adicionar")}

moldes:{nome:"Moldes, riscos e aulas",desc:"Nomes em ponto cruz, gráficos e riscos prontos, e aulas grátis",html(){return telaMoldes()},depois(){moldesLigar()}},

function calcT(){
  const L=+$("#tL").value||0,A=+$("#tA").value||0,c=+$("#tC").value||14,m=num($("#tM").value);
  const pc=c/2.54, wl=L/pc, ha=A/pc;
  $("#tR").innerHTML=`Bordado pronto: <b>${wl.toFixed(1)} × ${ha.toFixed(1)} cm</b><br>Cortar tecido: <b>${(wl+2*m).toFixed(0)} × ${(ha+2*m).toFixed(0)} cm</b><br><span class="mudo">${(L*A).toLocaleString("pt-BR")} pontos no total</span>`;
  const p=+$("#mP").value||0,f=+$("#mF").value;
  const porMeada=1600*(c/14)*(2/f);
  $("#mR").innerHTML=`Cerca de <b>${Math.max(1,Math.ceil(p/porMeada))} meada(s)</b> <span class="mudo">(uma meada rende ~${Math.round(porMeada).toLocaleString("pt-BR")} pontos)</span>`;
}
function calcP(){
  const h=num($("#cH").value),v=num($("#cV").value),pe=num($("#cPe").value),li=num($("#cLi").value),e=num($("#cE").value),m=num($("#cM").value);
  const custo=h*v+pe+li+e, preco=custo*(1+m/100);
  $("#cR").innerHTML=`Custo: <b>${brl(custo)}</b><br>Preço sugerido: <b style="font-size:1.3rem">${brl(Math.ceil(preco))}</b><br><span class="mudo">Sinal de 50%: ${brl(Math.ceil(preco/2))}</span>`;
}

/* ---- gráfico de ponto cruz ---- */
let IMG=null;
const SIMB="●▲■◆★♥✚✖○△□◇☆♦♣♠";
function exemploImg(){
  const c=document.createElement("canvas");c.width=c.height=200;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,200,200);
  x.fillStyle="#C72B3B";x.beginPath();x.moveTo(100,175);x.bezierCurveTo(10,115,15,40,65,40);x.bezierCurveTo(85,40,98,55,100,70);x.bezierCurveTo(102,55,115,40,135,40);x.bezierCurveTo(185,40,190,115,100,175);x.fill();
  x.fillStyle="#FCB0B9";x.beginPath();x.ellipse(70,75,14,10,-.6,0,7);x.fill();
  x.fillStyle="#47A72F";x.fillRect(96,8,8,34);x.beginPath();x.ellipse(118,22,16,8,-.4,0,7);x.fill();
  const i=new Image();i.onload=()=>{IMG=i;gerar()};i.src=c.toDataURL();
}
function rgb(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
const PAL=DMC.map(d=>({cod:d[0],nome:d[1],hex:d[2],rgb:rgb(d[2])}));
function dist(a,b){const r=(a[0]+b[0])/2,dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];return(2+r/256)*dr*dr+4*dg*dg+(2+(255-r)/256)*db*db}
function perto(p,lista){let m=1e12,k=null;for(const c of lista){const d=dist(p,c.rgb);if(d<m){m=d;k=c}}return k}
function gerar(){
  if(!IMG)return;
  const W=Math.max(10,Math.min(150,parseInt($("#gL").value)||40)),K=Math.max(2,Math.min(16,parseInt($("#gC").value)||6));
  const H=Math.max(1,Math.round(W*IMG.height/IMG.width));
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(IMG,0,0,W,H);
  const px=x.getImageData(0,0,W,H).data;const fundo=$("#gF").checked;
  const cel=[],cont=new Map();
  for(let i=0;i<W*H;i++){const p=[px[i*4],px[i*4+1],px[i*4+2]];
    if(px[i*4+3]<100||(fundo&&p[0]>235&&p[1]>235&&p[2]>235)){cel.push(null);continue}
    const k=perto(p,PAL);cel.push(k);cont.set(k,(cont.get(k)||0)+1)}
  const top=[...cont.entries()].sort((a,b)=>b[1]-a[1]).slice(0,K).map(e=>e[0]);
  const fin=new Map();const cel2=cel.map(k=>{if(!k)return null;const t=top.includes(k)?k:perto(k.rgb,top);fin.set(t,(fin.get(t)||0)+1);return t});
  const cv=$("#grade"),larg=Math.min(window.innerWidth-34,560-34),s=Math.max(8,Math.floor(larg/W)),sym=$("#gS").value==="1";
  cv.width=W*s+1;cv.height=H*s+1;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
  const ordem=[...fin.keys()];
  cel2.forEach((k,i)=>{if(!k)return;const cx=(i%W)*s,cy=Math.floor(i/W)*s;g.fillStyle=k.hex;g.fillRect(cx,cy,s,s);
    if(sym&&s>=10){const r=k.rgb;g.fillStyle=(r[0]*.3+r[1]*.59+r[2]*.11)>140?"#222":"#fff";g.font=`${Math.floor(s*.7)}px sans-serif`;g.textAlign="center";g.textBaseline="middle";g.fillText(SIMB[ordem.indexOf(k)%SIMB.length],cx+s/2,cy+s/2+1)}});
  for(let i=0;i<=W;i++){g.fillStyle=i%10===0?"#555":"#ccc";g.fillRect(i*s,0,i%10===0?1:.5,H*s)}
  for(let j=0;j<=H;j++){g.fillStyle=j%10===0?"#555":"#ccc";g.fillRect(0,j*s,W*s,j%10===0?1:.5)}
  const t=+$("#gT").value,pc=t/2.54,nP=cel2.filter(k=>k).length;const tem=new Set(D.linhas.filter(l=>l.qtd>0).map(l=>l.cod.toLowerCase()));
  $("#gInfo").innerHTML=`<div class="result">Gráfico de <b>${W} × ${H} pontos</b> · em etamine ${t}: <b>${(W/pc).toFixed(1)} × ${(H/pc).toFixed(1)} cm</b> · cortar ${(W/pc+10).toFixed(0)} × ${(H/pc+10).toFixed(0)} cm<br>${nP.toLocaleString("pt-BR")} pontos a ${brl(D.config.vp)} = <b>${brl(nP*D.config.vp)}</b> de bordado</div>
  <h3>Cores do gráfico</h3><div class="card"><div class="lista">${ordem.map(k=>`<div class="linha"><span class="carretel" style="background:${k.hex};display:grid;place-items:center;color:${(k.rgb[0]*.3+k.rgb[1]*.59+k.rgb[2]*.11)>140?"#222":"#fff"}">${SIMB[ordem.indexOf(k)%SIMB.length]}</span><div class="cresce"><b>DMC ${k.cod}</b> <span class="mudo">${k.nome}</span><div class="mudo">${fin.get(k).toLocaleString("pt-BR")} pontos · ~${Math.max(1,Math.ceil(fin.get(k)/(1600*t/14)))} meada(s)</div></div>${tem.has(k.cod.toLowerCase())?'<span class="chip pronto">tenho</span>':'<span class="bolinha b-laranja" title="Não tem no estoque"></span>'}</div>`).join("")}</div>
  <button class="btn sec" style="margin-top:10px;width:100%" onclick="compGraf()">Pôr as cores que faltam na lista de compras</button></div>
  <div class="linha" style="margin-top:10px"><button class="btn cresce" onclick="projGraf(${(W*H)-cel2.filter(k=>!k).length})">Criar projeto com este gráfico</button></div>`;
  window._falta=ordem.filter(k=>!tem.has(k.cod.toLowerCase()));
}
function compGraf(){let n=0;(window._falta||[]).forEach(k=>{const t=`Linha DMC ${k.cod} – ${k.nome}`;if(!D.compras.some(c=>c.txt===t&&!c.ok)){D.compras.push({id:uid(),txt:t,ok:false});n++}});salvar();aviso(n?"Adicionado à lista de compras":"Já está tudo na lista")}
function projGraf(total){D.projetos.unshift({id:uid(),nome:"Gráfico de ponto cruz "+new Date().toLocaleDateString("pt-BR"),tecnica:"Ponto cruz",total,feitos:0,carreira:0,obs:""});salvar();aviso("Projeto criado na aba Projetos")}

/* ---------- fotos e estimativa de pontos ---------- */
function carregaImg(f){return new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=r.result};r.readAsDataURL(f)})}
async function compImg(f,max=700){const i=await carregaImg(f);const s=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.72)}
async function preench(f){const i=await carregaImg(f);const W=80,H=Math.max(1,Math.round(80*i.height/i.width));const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(i,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
  const px=k=>[d[k*4],d[k*4+1],d[k*4+2]];const cs=[0,W-1,(H-1)*W,H*W-1].map(px);const bg=[0,1,2].map(j=>cs.reduce((s,c)=>s+c[j],0)/4);
  let n=0;for(let k=0;k<W*H;k++){const p=px(k);if(Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2])>90)n++}return Math.max(5,Math.min(100,Math.round(n/(W*H)*100)))}
function estimadorHTML(k){return `<div class="duas" style="margin-top:10px"><div class="campo"><label for="${k}L">Largura do bordado (cm)</label><input id="${k}L" inputmode="decimal" value="10"></div>

  <div class="duas"><div class="campo"><label for="${k}T">Tecido</label><select id="${k}T">${[11,14,16,18].map(t=>`<option value="${t}" ${t===14?"selected":""}>Etamine ${t}</option>`).join("")}</select></div>
  <div class="campo"><label for="${k}P">Parte bordada: <span id="${k}Pv">60</span>%</label><input type="range" id="${k}P" min="5" max="100" value="60" style="padding:0"></div></div>
  <div class="campo"><label for="${k}F">Foto só do bordado (mede a parte bordada sozinho)</label><input type="file" id="${k}F" accept="image/*"></div>
  <div class="mudo" id="${k}R"></div>`}
function estimar(k){const pc=(+$("#"+k+"T").value)/2.54;return Math.round(num($("#"+k+"L").value)*pc*num($("#"+k+"A").value)*pc*(+$("#"+k+"P").value)/100)}
function estLigar(k){const up=()=>{$("#"+k+"Pv").textContent=$("#"+k+"P").value;$("#"+k+"R").innerHTML=`Estimativa: <b>${estimar(k).toLocaleString("pt-BR")} pontos</b> = ${brl(estimar(k)*D.config.vp)}`};
  ["L","A","T","P"].forEach(s=>$("#"+k+s).addEventListener("input",up));$("#"+k+"T").addEventListener("change",up);
  $("#"+k+"F").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const p=await preench(f);$("#"+k+"P").value=p;aviso(`Parte bordada: ${p}%`);up()};up()}
function calcPP(){const n=+$("#ppN").value||0,v=num($("#ppV").value),c=num($("#ppC").value),t=n*v+c;

function addDias(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const iniSemana=iso=>addDias(iso,-new Date(iso+"T12:00").getDay());

function mudaMes(n){let[a,m]=mesCx.split("-").map(Number);m+=n;if(m<1){m=12;a--}if(m>12){m=1;a++}mesCx=a+"-"+String(m).padStart(2,"0");render()}

function resumo(a,b){
  const l=D.caixa.filter(c=>entre(c.data,a,b)).sort((x,y)=>x.data<y.data?1:-1);
  const tE=l.filter(c=>c.tipo==="entrada").reduce((s,c)=>s+(+c.valor||0),0),tS=l.filter(c=>c.tipo==="saida").reduce((s,c)=>s+(+c.valor||0),0);

  const vend=l.filter(c=>c.tipo==="entrada"&&/^Venda/.test(c.desc)).length;
  return{a,b,l,tE,tS,tP,aRec,vend,fica:tE-tP,sobra:tE-tS};
}

  const cv=$("#ofCv"),pos=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*OF.W,(e.clientY-b.top)/b.height*OF.H]};
  cv.onpointerdown=e=>{if(!OF.img)return;cv.setPointerCapture(e.pointerId);OF.arr=pos(e);OF.r={x:OF.arr[0],y:OF.arr[1],w:1,h:1}};
  cv.onpointermove=e=>{if(!OF.arr)return;const[p,q]=pos(e);OF.r={x:Math.min(p,OF.arr[0]),y:Math.min(q,OF.arr[1]),w:Math.abs(p-OF.arr[0]),h:Math.abs(q-OF.arr[1])};orcDesenha()};
  cv.onpointerup=()=>{OF.arr=null;if(OF.r&&(OF.r.w<8||OF.r.h<8))OF.r={x:OF.W*.1,y:OF.H*.1,w:OF.W*.8,h:OF.H*.8};orcMede()};
  if(OF.img)orcFoto(OF.img);else orcCalc();
}
function orcFoto(i){OF.img=i;const s=Math.min(1,420/Math.max(i.width,i.height));OF.W=Math.round(i.width*s);OF.H=Math.round(i.height*s);
  const c=document.createElement("canvas");c.width=OF.W;c.height=OF.H;const x=c.getContext("2d");x.drawImage(i,0,0,OF.W,OF.H);OF.px=x.getImageData(0,0,OF.W,OF.H).data;
  OF.r={x:OF.W*.1,y:OF.H*.1,w:OF.W*.8,h:OF.H*.8};$("#ofFotoBox").hidden=false;const cv=$("#ofCv");cv.width=OF.W;cv.height=OF.H;orcMede()}
function orcMascara(){const{px,W,r}=OF,x0=Math.round(r.x),y0=Math.round(r.y),x1=Math.round(r.x+r.w),y1=Math.round(r.y+r.h);
  let sb=[0,0,0],nb=0;const ad=(x,y)=>{const k=(y*W+x)*4;sb[0]+=px[k];sb[1]+=px[k+1];sb[2]+=px[k+2];nb++};
  for(let x=x0;x<x1;x+=2){ad(x,y0);ad(x,Math.max(y0,y1-1))}for(let y=y0;y<y1;y+=2){ad(x0,y);ad(Math.max(x0,x1-1),y)}
  const bg=sb.map(v=>v/Math.max(1,nb)),lim=(100-+$("#ofSens").value)*2.4+20,m=[];let n=0,t=0;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const k=(y*W+x)*4,d=Math.abs(px[k]-bg[0])+Math.abs(px[k+1]-bg[1])+Math.abs(px[k+2]-bg[2]);t++;if(d>lim){n++;m.push(k/4)}}
  return{pct:t?Math.round(n/t*100):0,m}}
function orcDesenha(m){const cv=$("#ofCv"),x=cv.getContext("2d"),r=OF.r;x.drawImage(OF.img,0,0,OF.W,OF.H);
  x.fillStyle="rgba(0,0,0,.45)";x.fillRect(0,0,OF.W,r.y);x.fillRect(0,r.y+r.h,OF.W,OF.H-r.y-r.h);x.fillRect(0,r.y,r.x,r.h);x.fillRect(r.x+r.w,r.y,OF.W-r.x-r.w,r.h);
  if(m){const d=x.getImageData(0,0,OF.W,OF.H);for(const i of m){const k=i*4;d.data[k]=d.data[k]*.45+232*.55;d.data[k+1]=d.data[k+1]*.45+73*.55;d.data[k+2]=d.data[k+2]*.45+110*.55}x.putImageData(d,0,0)}
  x.strokeStyle="#fff";x.lineWidth=2;x.setLineDash([6,4]);x.strokeRect(r.x,r.y,r.w,r.h);x.setLineDash([])}
function orcMede(){if(!OF.img)return orcCalc();const{pct,m}=orcMascara();orcDesenha(m);$("#ofP").value=Math.max(1,pct);
  const L=num($("#ofL").value)||10;$("#ofA").value=(L*OF.r.h/OF.r.w).toFixed(1);orcCalc()}
function orcValores(){const area=num($("#ofL").value)*num($("#ofA").value),pts=Math.round(area*num($("#ofD").value)*num($("#ofP").value)/100),bord=pts*D.config.vp,mat=num($("#ofM").value);return{area,pts,bord,mat,tot:Math.ceil((bord+mat)*100)/100}}
function orcCalc(){const v=orcValores();
  $("#ofR").innerHTML=`Área do bordado: ${v.area.toFixed(0)} cm²<br>Pontos estimados: <b style="font-size:1.2rem">${v.pts.toLocaleString("pt-BR")}</b><br>
  ${v.pts.toLocaleString("pt-BR")} × ${brl(D.config.vp)} = ${brl(v.bord)}${v.mat?` + ${brl(v.mat)} de material`:""}<br>
  Valor sugerido: <b style="font-size:1.4rem">${brl(v.tot)}</b>
  ${D.config.pct?`<div class="mudo">Reserva p/ material (${D.config.pct}%): ${brl(v.tot*D.config.pct/100)} · fica para você ${brl(v.tot*(1-D.config.pct/100))}</div>`:""}`}
function usaModelo(k){const m=MODELOS[k];$("#ofL").value=m.l;$("#ofA").value=m.a;$("#ofP").value=m.p;$("#ofT").value=m.t;$("#ofD").value=DENS[m.t].d;orcCalc();aviso("Modelo: "+m.n)}

function orcParaPeca(){const v=orcValores();D.produtos.unshift({id:uid(),nome:"Peça orçada "+new Date().toLocaleDateString("pt-BR"),cat:"Necessaire",pontos:v.pts,custo:v.mat,preco:v.tot,qtd:0,foto:fotoOrc()});

function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function payloadPix(v){const f=(id,x)=>id+String(x.length).padStart(2,"0")+x;

  let p=f("00","01")+f("26",f("00","br.gov.bcb.pix")+f("01",chavePix()))+f("52","0000")+f("53","986")+(v>0?f("54",v.toFixed(2)):"")+f("58","BR")+f("59",nome)+f("60",cid)+f("62",f("05","***"))+"6304";
  return p+crc16(p)}
function qrSVG(t){try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return""}}

  <div class="campo"><label>Sua chave Pix (${esc(D.pix.tipo)})</label><div class="linha"><input readonly value="${esc(D.pix.chave)}"><button class="btn sec peq" onclick="copiar(${esc(JSON.stringify(D.pix.chave))})">Copiar</button></div></div>

async function fazArte(p,comPreco){
  try{await document.fonts.load('64px "Young Serif"');await document.fonts.load('600 34px Figtree')}catch(e){}
  const c=document.createElement("canvas");c.width=c.height=1080;const x=c.getContext("2d"),img=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=p.foto});
  x.fillStyle="#f6f2ec";x.fillRect(0,0,1080,1080);
  x.strokeStyle="rgba(120,90,60,.08)";x.lineWidth=1;for(let k=0;k<1080;k+=12){x.beginPath();x.moveTo(k,0);x.lineTo(k,1080);x.moveTo(0,k);x.lineTo(1080,k);x.stroke()}
  const L=60,T=60,W=960,H=760,s=Math.max(W/img.width,H/img.height),sw=W/s,sh=H/s;
  x.save();x.beginPath();x.roundRect?x.roundRect(L,T,W,H,36):x.rect(L,T,W,H);x.clip();x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,L,T,W,H);x.restore();
  x.strokeStyle="#a8324a";x.lineWidth=5;for(let k=L;k<=L+W;k+=24){[T-26,T+H+24].forEach(y=>{x.beginPath();x.moveTo(k-7,y-7);x.lineTo(k+7,y+7);x.moveTo(k+7,y-7);x.lineTo(k-7,y+7);x.stroke()})}
  x.fillStyle="#2d2420";x.textBaseline="alphabetic";let fs=58;x.font=`${fs}px "Young Serif", Georgia, serif`;while(x.measureText(p.nome).width>(comPreco?640:960)&&fs>34){fs-=2;x.font=`${fs}px "Young Serif", Georgia, serif`}
  x.fillText(p.nome,L,T+H+110);
  if(comPreco){x.font='64px "Young Serif", Georgia, serif';x.fillStyle="#a8324a";x.textAlign="right";x.fillText(brl(p.preco),L+W,T+H+110);x.textAlign="left"}
  x.font='600 32px Figtree, sans-serif';x.fillStyle="#7a6b62";
  const rod=[D.marca.insta?"@"+D.marca.insta:"",D.marca.zap?"Encomendas: "+fone(D.marca.zap):""].filter(Boolean).join("   ·   ");x.fillText(rod,L,T+H+170);
  const lg=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=LOGO});if(lg){x.save();x.shadowColor="rgba(0,0,0,.25)";x.shadowBlur=18;x.drawImage(lg,L+W-170,T+20,150,150);x.restore()}
  if(D.marca.nome){x.font='34px "Young Serif", Georgia, serif';x.fillStyle="#a8324a";x.textAlign="right";x.fillText(D.marca.nome,L+W,T+H+170);x.textAlign="left"}
  return c}
async function compartilharArte(id){const p=D.produtos.find(x=>x.id===id);try{

  {tela:"Catálogo",cap:"Vendeu uma peça pronta? Toque em Vender embaixo dela.",btn:"Vender"},
  {tela:"Vender",cap:"Confira a quantidade, o preço e a forma de pagamento, e toque em Confirmar venda. A venda já entra no caixa e o estoque diminui sozinho.",btn:"Confirmar venda"},
  {tela:"Encomendas",cap:"Para encomendas, abra a encomenda e toque em Lançar no caixa quando receber o dinheiro.",btn:"Lançar no caixa",sec:1}]},
 {t:"Caixa",cenas:[

  {tela:"Caixa",cap:"A reserva para material separa vinte por cento de tudo que entra, para comprar linha e tecido. Se não quiser separar, toque em zero por cento.",el:["pct"]},
  {tela:"Caixa",cap:"Comprou material? Toque no botão vermelho Lançar gasto e escolha: linha, etamine, zíper, bastidor.",btn:"− Lançar gasto",verm:1},
  {tela:"Caixa",cap:"Mais embaixo tem o resumo da semana e do mês. As setinhas mudam o dia, a semana ou o mês.",el:["linha","linha","linha"]}]},
 {t:"Linhas",cenas:[

  {tela:"Linhas",cap:"Quando sobra uma meada ou nenhuma, aparece a bolinha laranja. O botão Puxar linhas acabando monta a lista de compras.",btn:"Puxar linhas acabando",sec:1},
  {tela:"Linhas",cap:"Depois toque em Copiar lista para o WhatsApp e mande para quem vai comprar.",btn:"Copiar lista"}]},
 {t:"Ferramentas",cenas:[

  {tela:"Ferramentas",cap:"Tem também calculadora de tecido, de meadas e de preço por ponto. É só preencher que o resultado aparece na hora.",el:["campo:Quantidade de pontos","linha"]},
  {tela:"Ferramentas",cap:"Em Projetos e contadores você conta os pontos feitos e as carreiras, tocando no mais e no menos.",btn:"+",},
  {tela:"Ferramentas",cap:"E no Guia de pontos tem a explicação de cada ponto: cruz, haste, corrente, nó francês, rococó e outros.",btn:"Guia de pontos",sec:1},
  {tela:"Moldes e aulas",cap:"Em Moldes, riscos e aulas, digite um nome e o app monta o gráfico de ponto cruz, com o tamanho, os pontos e o preço. Dá até para virar encomenda.",btn:"Fazer encomenda"},
  {tela:"Moldes e aulas",cap:"Tem gráficos prontos, como coração, flor, borboleta e casinha, e riscos para bordado livre. No modo decalque, coloque o tecido em cima da tela e risque.",btn:"Abrir para decalcar",sec:1},
  {tela:"Moldes e aulas",cap:"E na parte Aulas e moldes grátis tem atalhos para vídeos no YouTube e moldes grátis no Google e no Pinterest.",btn:"▶ Aulas grátis"}]},
 {t:"Instagram e Pix",cenas:[
  {tela:"Mais opções",cap:"No menu de três risquinhos, toque em Minha chave Pix, Instagram e WhatsApp. Coloque sua chave Pix uma vez só.",btn:"Minha chave Pix",sec:1},
  {tela:"Encomendas",cap:"Para cobrar uma cliente, abra a encomenda e toque em Cobrar com Pix. Aparece o QR Code com o valor e a mensagem pronta.",btn:"Cobrar com Pix"},
  {tela:"Caixa",cap:"No Caixa tem a lista Quem está me devendo. Toque em Cobrar ao lado do nome.",btn:"Cobrar",sec:1},

  {tela:"Postar no Insta",cap:"Toque em Compartilhar e escolha o Instagram. Depois cole a legenda e publique.",btn:"Compartilhar"}]},
 {t:"Cuidados",cenas:[
  {tela:"Mais opções",cap:"Seus dados ficam guardados neste celular. De vez em quando toque em Fazer cópia de segurança e guarde o texto no WhatsApp.",btn:"Fazer cópia de segurança",sec:1},
  {tela:"Mais opções",cap:"Trocou de celular? Use Restaurar cópia e cole o texto guardado.",btn:"Restaurar cópia",sec:1},
  {tela:"Início",cap:"Lá em cima, do lado do seu nome, tem dois símbolos: a setinha saindo da caixinha compartilha o aplicativo, e a setinha girando atualiza o aplicativo.",el:["icones"]},
  {tela:"Mais opções",cap:"Lá embaixo de todas as telas ficam a Aula e o Como usar, para rever quando quiser. Pronto, agora é só bordar!",btn:"▶ Aula"}]}];
let AU={c:0,i:0,toca:true,som:true,timer:null};
function abrirAula(c){AU.c=c||0;AU.i=0;AU.toca=true;
  const d=document.createElement("div");d.className="aula";d.id="aula";d.setAttribute("role","dialog");d.setAttribute("aria-label","Aula do aplicativo");
  d.innerHTML=`<div class="aula-in">
   <div class="linha"><b class="cresce" style="font-family:var(--f-tit);font-weight:400;font-size:1.25rem">Aula do Ateliê</b><button class="btn sec peq" onclick="fecharAula()">Fechar</button></div>
   <div class="cap-lista" id="auCaps"></div>
   <div class="celular" id="auCel"></div>
   <div class="progresso"><i id="auProg" style="width:0"></i></div>
   <div class="legenda-aula" id="auCap" aria-live="polite"></div>
   <div class="aula-ctrl"><button class="btn sec" onclick="auPasso(-1)" aria-label="Voltar">‹</button><button class="btn" id="auPlay" onclick="auPlay()">Pausar</button><button class="btn sec" onclick="auPasso(1)" aria-label="Avançar">›</button><button class="btn sec" id="auSom" onclick="auSom()">Som ligado</button></div>
   <p class="mudo" style="text-align:center;margin:0">A aula fala sozinha e passa as telas. Pode pausar quando quiser.</p></div>`;
  document.body.appendChild(d);D.viuAula=true;salvar();auMostra()}
function fecharAula(){clearTimeout(AU.timer);try{speechSynthesis.cancel()}catch(e){};const a=$("#aula");if(a)a.remove()}
function auCena(){return AULAS[AU.c].cenas[AU.i]}
function auVis(c){
  const el=(c.el||[]).map(e=>{
    if(e==="linha")return '<div class="cel-linha"></div>';
    if(e==="icones")return '<div class="linha" style="justify-content:flex-end;gap:14px"><span class="cel-btn sec" style="padding:6px 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span><span class="cel-btn sec" style="padding:6px 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="dedo"></span></span></div>';
    if(e==="abas")return '<div class="linha" style="justify-content:space-between;margin-top:120px;font-size:.7rem;color:var(--sub)"><span>Início</span><span>Encomendas</span><span>Catálogo</span><span>Caixa</span><span>Linhas</span></div>';
    if(e==="chips")return '<div class="linha" style="flex-wrap:wrap"><span class="chip aguardando">Aguardando</span><span class="chip bordando">Bordando</span><span class="chip pronto">Pronto</span><span class="chip entregue">Entregue</span></div>';
    if(e==="bolinhas")return '<div class="linha"><span class="bolinha b-laranja"></span> entrega chegando</div><div class="linha"><span class="bolinha b-vermelha"></span> atrasada</div>';
    if(e==="pct")return '<div class="filtros"><button class="on">20%</button><button>0%</button></div><div class="mudo">fica para você</div>';
    if(e==="cores")return '<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px">'+DMC.slice(0,16).map(d=>`<span style="aspect-ratio:1;border-radius:5px;background:${d[2]};border:1px solid var(--linha)"></span>`).join("")+'</div>';
    if(e.startsWith("campo:"))return `<div class="cel-campo">${e.slice(6)}</div>`;return""}).join("");
  const b=c.btn?`<span class="cel-btn ${c.sec?"sec":""}" style="${c.verm?"background:var(--vermelho)":""}">${esc(c.btn)}<span class="dedo"></span></span>`:"";
  return `<div class="cel-topo">${D.perfil.foto?`<img src="${D.perfil.foto}" alt="" style="width:26px;height:26px;border-radius:50%;object-fit:cover">`:""}${esc(c.tela)}</div><div class="cel-corpo">${el}${b}<div class="cel-linha" style="width:70%"></div><div class="cel-linha" style="width:50%"></div></div>`}
function auMostra(){
  clearTimeout(AU.timer);try{speechSynthesis.cancel()}catch(e){}
  const c=auCena(),tot=AULAS.reduce((s,a)=>s+a.cenas.length,0),feitas=AULAS.slice(0,AU.c).reduce((s,a)=>s+a.cenas.length,0)+AU.i+1;
  $("#auCaps").innerHTML=AULAS.map((a,k)=>`<button class="${k===AU.c?"on":""}" onclick="AU.c=${k};AU.i=0;auMostra()">${a.t}</button>`).join("");
  const on=$("#auCaps .on");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
  $("#auCel").innerHTML=auVis(c);$("#auCap").textContent=c.cap;$("#auProg").style.width=(feitas/tot*100)+"%";
  $("#auPlay").textContent=AU.toca?"Pausar":"Continuar";$("#auSom").textContent=AU.som?"Som ligado":"Sem som";
  if(!AU.toca)return;
  const prox=()=>{AU.timer=setTimeout(()=>auPasso(1,true),900)};
  let falou=false;
  if(AU.som){try{const u=new SpeechSynthesisUtterance(c.cap);u.lang="pt-BR";u.rate=1;
    const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;
    u.onend=()=>{if(AU.toca&&$("#aula"))prox()};speechSynthesis.speak(u);falou=true}catch(e){}}
  AU.timer=setTimeout(()=>auPasso(1,true),falou?Math.max(9000,c.cap.length*95):Math.max(5000,c.cap.length*65));
}
function auPasso(n,auto){const a=AULAS[AU.c];AU.i+=n;
  if(AU.i>=a.cenas.length){if(AU.c<AULAS.length-1){AU.c++;AU.i=0}else{AU.i=a.cenas.length-1;if(auto){AU.toca=false;auMostra();$("#auCap").textContent="Fim da aula! Toque em Fechar para começar a usar.";return}}}
  if(AU.i<0){if(AU.c>0){AU.c--;AU.i=AULAS[AU.c].cenas.length-1}else AU.i=0}
  auMostra()}
function auPlay(){AU.toca=!AU.toca;auMostra()}
function auSom(){AU.som=!AU.som;auMostra()}

/* ---------- como usar (texto) ---------- */
function guia(){abrir(`<h2 style="margin-top:4px">Como usar</h2>
  <button class="btn" style="width:100%;margin-bottom:10px" onclick="fechar();abrirAula(0)">▶ Assistir à aula</button>
  <div class="card">${AULAS.map((a,k)=>`<details class="passo" ${k===0?"open":""}><summary>${a.t}</summary><ul>${a.cenas.map(c=>`<li>${esc(c.cap)}</li>`).join("")}</ul>
   <button class="voltar" style="padding:4px 0" onclick="fechar();abrirAula(${k})">▶ Ver esta parte em aula</button></details>`).join("")}</div>
  <button class="btn sec" style="width:100%;margin-top:12px" onclick="fechar()">Fechar</button>`)}

/* ---------- render ---------- */
const listaVira=()=>{const pf=D.perfil;return[...(pf.fotos||[]),...(pf.logo&&pf.fotos&&pf.fotos.length?[LOGO_GIRA]:[])]};
let VI={i:0,ang:0,t:null};
function viraIniciar(){const l=listaVira();VI.i=VI.i%Math.max(1,l.length);
  document.querySelectorAll(".flip-in").forEach(el=>{el.style.transition="none";el.style.transform=`rotateY(${VI.ang}deg)`;const im=el.querySelectorAll("img"),frente=(VI.ang/180)%2===0;
    im[frente?0:1].src=l[VI.i]||"";im[frente?1:0].src=l[(VI.i+1)%Math.max(1,l.length)]||"";void el.offsetWidth;el.style.transition=""});
  clearInterval(VI.t);if(l.length>1)VI.t=setInterval(viraPasso,4000)}
function viraPasso(){const l=listaVira();if(l.length<2)return;VI.i=(VI.i+1)%l.length;VI.ang+=180;const frente=(VI.ang/180)%2===0;
  document.querySelectorAll(".flip-in").forEach(el=>{const im=el.querySelectorAll("img");im[frente?0:1].src=l[VI.i];el.style.transform=`rotateY(${VI.ang}deg)`;
    setTimeout(()=>{im[frente?1:0].src=l[(VI.i+1)%l.length]},1000)})}
function topo(){const pf=D.perfil;pf.foto=(pf.fotos&&pf.fotos[0])||null;$("#btnPerfil").hidden=!pf.foto;$("#iconeTopo").hidden=!!pf.foto;$("#nomeTopo").textContent=pf.nome||"Dry'Arts"}
let FOTOS_ED=[];
function editaPerfil(){const pf=D.perfil;FOTOS_ED=[...(pf.fotos||[])];
  abrir(`<h2 style="margin-top:4px">Suas fotos e nome</h2>
  <p class="mudo" style="margin-top:0">Coloque quantas fotos quiser. Elas ficam virando uma depois da outra.</p>
  <div class="fotos-ed" id="pfLista"></div>
  <div class="duas"><div class="campo"><label for="pfCam">Tirar foto</label><input type="file" id="pfCam" accept="image/*" capture="user"></div>
  <div class="campo"><label for="pfF">Adicionar da galeria</label><input type="file" id="pfF" accept="image/*" multiple></div></div>
  <label class="linha" style="margin-bottom:10px"><input type="checkbox" id="pfLogo" style="width:auto" ${pf.logo?"checked":""}> Mostrar o logo Dry'Arts no meio das fotos</label>
  <div class="linha" style="flex-wrap:wrap;margin-bottom:10px"><button class="btn sec peq" onclick="FOTOS_ED=[];pfLista()">Ficar sem foto</button><button class="btn sec peq" onclick="if(!FOTOS_ED.includes(FOTO_PADRAO))FOTOS_ED.unshift(FOTO_PADRAO);pfLista()">Voltar a foto original</button></div>
  <div class="campo"><label for="pfT">Tamanho da foto: <span id="pfTv">${pf.tam}</span> px</label><input type="range" id="pfT" min="40" max="160" value="${pf.tam}" style="padding:0"></div>
  <div class="campo"><label for="pfN">Nome (pode deixar vazio)</label><input id="pfN" value="${esc(pf.nome)}" placeholder="Ex.: Adri"></div>
  <div class="linha"><button class="btn sec cresce" onclick="fechar()">Cancelar</button><button class="btn cresce" onclick="salvaPerfil()">Salvar</button></div>`);
  $("#pfT").oninput=e=>{$("#pfTv").textContent=e.target.value};
  const add=async ev=>{for(const f of ev.target.files){try{FOTOS_ED.push(await compQuad(f))}catch(e){aviso("Não consegui abrir uma das fotos")}}ev.target.value="";pfLista()};
  $("#pfF").onchange=add;$("#pfCam").onchange=add;pfLista()}
function pfLista(){$("#pfLista").innerHTML=FOTOS_ED.map((f,k)=>`<div><img src="${f}" alt="Foto"><button onclick="FOTOS_ED.splice(${k},1);pfLista()" aria-label="Tirar esta foto">×</button></div>`).join("")||'<span class="mudo">Nenhuma foto. Adicione abaixo.</span>'}
async function compQuad(f){const i=await carregaImg(f);const s=Math.min(i.width,i.height),c=document.createElement("canvas");c.width=c.height=360;c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,360,360);return c.toDataURL("image/jpeg",.75)}
function salvaPerfil(){D.perfil={nome:$("#pfN").value.trim(),fotos:FOTOS_ED,foto:FOTOS_ED[0]||null,logo:$("#pfLogo").checked,tam:+$("#pfT").value};VI.i=0;try{localStorage.setItem(CHAVE,JSON.stringify(D))}catch(e){aviso("Memória cheia: tire alguma foto");return}salvar();fechar();render();aviso("Foto e nome salvos")}
function render(){
  topo();setTimeout(viraIniciar,0);
  $("#tela").innerHTML=telas[aba]();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("ativo",b.dataset.aba===aba));
  if(aba==="ferramentas"&&sub&&FERR[sub].depois)FERR[sub].depois();
  pontos();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{aba=b.dataset.aba;sub=null;render();window.scrollTo(0,0)});
$("#btnMais").onclick=abrirMais;
const h=new Date().getHours();$("#saudacao").textContent=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
$("#versao").textContent=VERSAO;$("#logoRod").src=LOGO_GIRA;
render();
</script>
